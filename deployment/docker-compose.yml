version: '3.8'

services:

  backend:
    build:
      context: ../backend
      dockerfile: ../deployment/Dockerfile.backend
      args:
        - PYPI_MIRROR=https://mirrors.aliyun.com/pypi/simple/
        - APP_COMMIT=${APP_COMMIT:-unknown}
        - APP_VERSION=${APP_VERSION:-v1.0.0}
    container_name: pm_backend
    restart: always
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin123}@host.docker.internal:${MONGODB_PORT:-27017}/
      - MONGODB_HOST=host.docker.internal
      - DATABASE_NAME=${DATABASE_NAME:-project_management}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-80}}
      - PROJECT_ROOT=/workspace
      - SYSTEM_REPO_URL=${SYSTEM_REPO_URL:-https://github.com/zt15242/Project-Management-Software.git}
      - SYSTEM_REPO_BRANCH=${SYSTEM_REPO_BRANCH:-main}
      - SYSTEM_UPDATE_COMMAND=${SYSTEM_UPDATE_COMMAND:-}
      - APP_VERSION_FILE=/app/VERSION
      - APP_COMMIT=${APP_COMMIT:-unknown}
      - APP_VERSION=${APP_VERSION:-v1.0.0}
      - OSS_PROVIDER=${OSS_PROVIDER}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME}
      - OSS_REGION=${OSS_REGION}
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_ASR_MODEL=${DASHSCOPE_ASR_MODEL}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL}
    volumes:
      - ../:/workspace:ro
      - ../backend:/app
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - pm_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/Dockerfile.frontend
      args:
        - NPM_REGISTRY=https://registry.npmmirror.com
        - APP_COMMIT=${APP_COMMIT:-unknown}
        - APP_VERSION=${APP_VERSION:-v1.0.0}
    container_name: pm_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - pm_network
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pm_network:
    driver: bridge
