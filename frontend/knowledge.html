<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 - 项目管理系统</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/knowledge.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html">📚 项目管理系统</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="projects.html">项目</a></li>
                <li><a href="tasks.html">任务</a></li>
                <li><a href="bugs.html">BUG</a></li>
                <li><a href="knowledge.html" class="active">知识库</a></li>
                <li><a href="deployments.html">代码发布</a></li>
                <li><a href="statistics.html">统计</a></li>
                <li class="user-menu">
                    <span id="userDisplay">加载中...</span>
                    <div class="dropdown">
                        <a href="profile.html">个人中心</a>
                        <a href="#" onclick="logout()">退出登录</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>项目筛选</h3>
                <select id="projectFilter" class="form-control">
                    <option value="">所有项目</option>
                </select>
            </div>

            <div class="sidebar-section">
                <h3>文件类型</h3>
                <div class="filter-group">
                    <label><input type="checkbox" value="markdown"> Markdown</label>
                    <label><input type="checkbox" value="word"> Word</label>
                    <label><input type="checkbox" value="excel"> Excel</label>
                    <label><input type="checkbox" value="pdf"> PDF</label>
                    <label><input type="checkbox" value="text"> 文本</label>
                    <label><input type="checkbox" value="image"> 图片</label>
                    <label><input type="checkbox" value="other"> 其他</label>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>分类</h3>
                <div id="categoryList" class="category-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>标签</h3>
                <div id="tagList" class="tag-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>统计信息</h3>
                <div id="statistics" class="statistics">
                    <div class="stat-item">
                        <span class="stat-label">总文档数</span>
                        <span class="stat-value" id="totalDocs">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">总浏览量</span>
                        <span class="stat-value" id="totalViews">0</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 内容区 -->
        <main class="content">
            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索文档标题、内容..." class="form-control">
                    <button onclick="searchKnowledge()" class="btn btn-primary">🔍 搜索</button>
                </div>
                <div class="toolbar-actions">
                    <button onclick="showUploadModal()" class="btn btn-success">📤 上传文档</button>
                </div>
            </div>

            <!-- 文档列表 -->
            <div id="knowledgeList" class="knowledge-list">
                <div class="loading">加载中...</div>
            </div>
        </main>
    </div>

    <!-- 上传文档模态框 -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>上传知识库文档</h2>
                <span class="close" onclick="closeUploadModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="uploadForm">
                    <div class="form-group">
                        <label>文档标题 *</label>
                        <input type="text" id="docTitle" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>所属项目 *</label>
                        <select id="docProject" class="form-control" required>
                            <option value="">请选择项目</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>分类</label>
                        <input type="text" id="docCategory" class="form-control" placeholder="例如：技术文档、需求文档">
                    </div>

                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="docDescription" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>标签</label>
                        <input type="text" id="docTags" class="form-control" placeholder="多个标签用逗号分隔">
                    </div>

                    <div class="form-group">
                        <label>选择文件 *</label>
                        <input type="file" id="docFile" class="form-control" required
                            accept=".md,.doc,.docx,.xls,.xlsx,.pdf,.txt,.png,.jpg,.jpeg,.gif">
                        <small class="form-text">支持格式：MD, Word, Excel, PDF, TXT, 图片</small>
                    </div>

                    <div class="form-actions">
                        <button type="button" onclick="closeUploadModal()" class="btn btn-secondary">取消</button>
                        <button type="submit" class="btn btn-primary">上传</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 文档详情模态框 -->
    <div id="detailModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="detailTitle">文档详情</h2>
                <span class="close" onclick="closeDetailModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="detailContent" class="detail-content">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api-config.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/knowledge.js?v=2"></script>
</body>

</html>
